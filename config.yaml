# commandcode-affordable v0.1.5
# Every model below is a CommandCode model id, exactly as
# https://api.commandcode.ai/provider/v1/models returns it.
# Prices are CommandCode's published list prices, read 2026-10-06 from
# https://commandcode.ai/models — they change, so check before trusting a number.
#
# Why this file exists: auxiliary.<task>.provider "auto" routes every side task to
# your MAIN model. Pinning them here means you can /model up to an expensive model
# for a hard turn while vision, compression, titles and approvals stay cheap.
#
# CommandCode-specific notes:
#   * Only the DeepSeek family is billed off-peak/peak. Peak is 01-04 and 06-10 UTC,
#     Mon-Fri only (2x). In IST that is 06:30-09:30 and 11:30-15:30, weekdays.
#     The main, compression, approval, triage and title lanes are all flat-priced
#     (MiMo, GLM, GPT-6 Luna), so they never double. Only the vision lane, which is
#     DeepSeek, still has a peak band.
#   * v0.1.5 moved the main, compression, approval and triage lanes off the DeepSeek
#     V4.1 fast tier and onto xiaomi/mimo-v2.6-flash. It is cheaper on every axis
#     ($0.14/$0.28, cache read $0.0028 vs $0.16/$0.58, cache read $0.016), carries a
#     published Intelligence Index (37.9, vs not scored), and — being flat — does not
#     double during the peak windows listed above. The vision lane is unchanged:
#     deepseek/deepseek-v4-flash-vision-exp is still the cheapest vision lane.
#   * v0.1.4 reverted the GLM lanes to GLM-5.3 *Flash*, undoing the v0.1.2 move to
#     FlashX. Flash is cheaper on every rate and, unlike FlashX, carries a published
#     Intelligence Index (41.8). FlashX was the faster tier; Flash is the cheaper one.
#   * v0.1.1 removed the free and stealth lanes (`...:free`, `stealth/*`) from every
#     slot. A lane that is free "while it lasts" can vanish, get rate-limited, or
#     degrade without warning, and a silently downgraded title or approval check is
#     worth less than the fraction of a cent it saves. Every slot names a paid
#     model, and v0.1.5 keeps it that way.

model:
  provider: commandcode
  default: xiaomi/mimo-v2.6-flash                       # $0.14/$0.28 per M, cache read $0.0028, 1.05M ctx, index 37.9, FLAT (no peak band); /model up for hard turns

display:
  show_cost: true                                  # set, but inert on CommandCode — no provider pricing to read; see README "cost visibility"

auxiliary:
  # Image analysis (vision_analyze + browser screenshots). An explicit vision
  # backend also sends images through this describer even when the main model
  # claims native vision (agent.image_input_mode: auto).
  vision:
    provider: commandcode
    model: deepseek/deepseek-v4-flash-vision-exp   # $0.15/$0.60, cache read $0.003, 1M ctx, index 34.8; 2x in the peak windows above
    fallback_chain:
      - provider: commandcode
        model: google/gemini-3.5-flash-lite        # $0.30/$2.50 — pricier, used only if the DeepSeek vision lane fails
      - provider: commandcode
        model: google/gemini-3.1-flash-lite        # $0.25/$1.50

  # Context compression is the session's memory of itself, so this slot buys
  # fact retention rather than the absolute cheapest lane. It rides the same model
  # as the main lane, and that model is scored (37.9) and flat-priced, so the
  # repeated re-read of a long session costs $0.0028 per M rather than the
  # DeepSeek lane's $0.016 — 5.7x cheaper on the rate most of a summary is made of.
  compression:
    provider: commandcode
    model: xiaomi/mimo-v2.6-flash
    reasoning_effort: low
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash                   # $0.15/$0.50, cache read $0.03, 1M ctx, flat-priced, index 41.8

  # Dangerous-command classifier (approvals.mode: smart). A miss here is the
  # expensive kind of miss, so this slot takes the scored lane rather than the
  # cheapest one: index 37.9 at $0.14/$0.28, flat-priced, with the higher-scored
  # GLM-5.3 Flash (41.8) behind it as the fallback.
  approval:
    provider: commandcode
    model: xiaomi/mimo-v2.6-flash
    reasoning_effort: low
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash                   # $0.15/$0.50, cache read $0.03, 1M ctx, flat-priced, index 41.8

  # The high-volume, low-stakes slots: a session title, a one-line profile blurb,
  # a better memory search string. Each turns a few thousand input tokens into a
  # handful of output tokens, so input price dominates the bill — and `gpt-6-luna`
  # has the cheapest input of any scored model in the catalog ($0.10/M, cache read
  # $0.01), at $0.50/M out. It is flat-priced, so it never doubles.
  title_generation:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash
  skills_hub:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash
  mcp:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash
  profile_describer:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash
  monitor:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash
  tts_audio_tags:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash
  memory_query_rewrite:
    provider: commandcode
    model: gpt-6-luna
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash

  # This one expands a one-liner into a written spec, so it produces real output
  # rather than a few tokens, and takes the same scored lane as approval.
  triage_specifier:
    provider: commandcode
    model: xiaomi/mimo-v2.6-flash                 # $0.14/$0.28, cache read $0.0028, 1.05M ctx, flat-priced, index 37.9
    fallback_chain:
      - provider: commandcode
        model: z-ai/glm-5.3-flash                   # $0.15/$0.50, cache read $0.03, 1M ctx, flat-priced, index 41.8

  # Left on "auto" (= the main model) on purpose, because these shape what the
  # agent keeps and plans rather than how fast it runs:
  #   background_review - writes your memory and skills; on auto it replays the
  #                       conversation on a warm prompt cache.
  #   curator           - consolidates skills.
  #   kanban_decomposer, goal_judge - planning calls where quality pays for itself.
  #   review            - the /review subagent; give it the model you trust.
